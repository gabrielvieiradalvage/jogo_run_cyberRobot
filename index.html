<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta charset="utf-8"/>

    <meta http-equiv="pragma" content="no-cache"/>

    <title>Cyber Robot Run</title>

    <!-- Fontes Estilo Cyberpunk -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #121826 0%, #05070a 100%);
            color: #00f0ff;
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Cabeçalho do Jogo */
        header {
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.6rem;
            color: #fff;
            text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff;
            margin: 0 0 3px 0;
            letter-spacing: 2px;
        }

        p.subtitle {
            font-size: 0.8rem;
            color: #ff007f;
            text-shadow: 0 0 5px #ff007f;
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Moldura Neon reduzida e centralizada */
        .game-wrapper {
            position: relative;
            padding: 3px;
            background: linear-gradient(135deg, #00f0ff, #ff007f);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3), inset 0 0 10px rgba(255, 0, 127, 0.2);
            max-width: 900px; /* Controla o tamanho ideal na tela */
            width: 100%;
        }

        .game-container {
            background: #05070a;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Canvas ajustado para não ficar gigante */
        canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
            max-height: 75vh;
            object-fit: contain;
            image-rendering: optimizeSpeed;
            -webkit-interpolation-mode: nearest-neighbor;
            -ms-touch-action: none;
            touch-action: none;
            margin: 0px;
            padding: 0px;
            border: 0px;
        }

        /* Tela de Início para liberar áudio e som */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 10, 0.94);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99;
            transition: opacity 0.4s ease;
        }

        #start-btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: #05070a;
            background: linear-gradient(135deg, #00f0ff, #00ff88);
            border: none;
            padding: 12px 28px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.8);
            background: linear-gradient(135deg, #ff007f, #00f0ff);
            color: #fff;
        }

        .start-hint {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #8a9bb8;
            letter-spacing: 1px;
        }

        :-webkit-full-screen #canvas {
            width: 100%;
            height: 100%;
        }
        :-webkit-full-screen {
            width: 100%;
            height: 100%;
        }
        
        div.gm4html5_div_class {
            margin: 0px;
            padding: 0px;
            border: 0px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        div.gm4html5_login {
            padding: 20px;
            position: absolute;
            border: solid 2px #00f0ff;
            background-color: #121826;
            color: #00f0ff;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            font-family: 'Share Tech Mono', monospace;
        }
        div.gm4html5_cancel_button {
            float: right;
        }
        div.gm4html5_login_button {
            float: left;
        }
        div.gm4html5_login_header {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
        }

        /* Rodapé */
        footer {
            margin-top: 10px;
            font-size: 0.75rem;
            color: #8a9bb8;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <header>
        <h1>CYBER ROBOT RUN</h1>
        <p class="subtitle">&gt;&gt; SYSTEM ONLINE &lt;&lt;</p>
    </header>

    <div class="game-wrapper">
        <div class="game-container">
            
            <!-- Tela de Clique para Ativar o Áudio e Iniciar -->
            <div id="start-screen">
                <button id="start-btn">&#9658; INICIAR SISTEMA</button>
                <div class="start-hint">Clique para ativar áudio e iniciar o jogo</div>
            </div>

            <div class="gm4html5_div_class" id="gm4html5_div_id">
                <!-- Canvas do GameMaker -->
                <canvas id="canvas" width="1366" height="768">
                    <p>Your browser doesn't support HTML5 canvas.</p>
                </canvas>
            </div>

        </div>
    </div>

    <footer>
        GameMaker HTML5 Engine &bull; All Systems Operational
    </footer>

    <!-- Run the game code -->
    <script type="text/javascript" src="html5game/Nome temporario.js?cachebust=629581849"></script>

    <script>
        // Dispara o GameMaker após o clique do usuário (autorizando o navegador a tocar músicas/sons)
        document.getElementById('start-btn').addEventListener('click', function() {
            var startScreen = document.getElementById('start-screen');
            startScreen.style.opacity = '0';
            setTimeout(function() {
                startScreen.style.display = 'none';
            }, 400);

            if (typeof GameMaker_Init === 'function') {
                GameMaker_Init();
            }
        });
    </script>

</body>

</html>
